
name: PHP Code Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-validation:
    name: PHP ${{ matrix.php }} Validation
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ['7.4', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Verify PHP version
        run: php -v

      - name: Validate PHP syntax
        run: php -l woocommerce-auto-discount.php

      - name: Validate test file syntax
        run: php -l tests/discount-test.php

      - name: Run automated unit tests
        run: php tests/discount-test.php
